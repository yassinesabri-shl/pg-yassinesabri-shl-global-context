name: global-gate
on:
  pull_request:                   # no `paths:` filter: a required check must report on every pull request
permissions:
  contents: read
jobs:
  global:
    name: global-gate             # branch protection names the job, not the file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the check walks the history for an id used again; a shallow clone is exit 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check every global document, and the two caps
        run: |
          set -uo pipefail
          node scripts/check-context.mjs --global
